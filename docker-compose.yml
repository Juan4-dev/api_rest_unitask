
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_container
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=unitask_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=1234
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_api

  db:
    image: postgres:latest
    container_name: postgres_container
    environment:
      - POSTGRES_DB=unitask_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    ports:
      - "5432:5432"
    networks:
      - red_api
    volumes:
      - postgres_data_api:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unitask_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=1234
    ports:
      - "8081:80"
    networks:
      - red_api
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data_api:
  pgadmin_data:

networks:
  red_api:
    driver: bridge
